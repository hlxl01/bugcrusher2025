<!DOCTYPE html>
<html>
  <style>
    .img-comp-container {
      position: relative;
      height: 500px; /*should be the same height as the images*/
    }
    
    .img-comp-img {
      position: absolute;
      width: auto;
      height: auto;
      overflow: hidden;
    }
    
    .img-comp-img img {
      display: block;
      vertical-align: middle;
    }
    
    .img-comp-slider {
      position: absolute;
      z-index: 9;
      cursor: ew-resize;
      /*set the appearance of the slider:*/
      width: 40px;
      height: 40px;
      background-color: #2196F3;
      opacity: 0.7;
      border-radius: 50%;
    }
  
    ::-webkit-scrollbar {
      display: none;
    }
  </style>
  <head>
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
  </head>
  <body>
    <div class="img-comp-container">
      <div class="img-comp-img">
        <img src="https://www.foodandwine.com/thmb/DI29Houjc_ccAtFKly0BbVsusHc=/1500x0/filters:no_upscale():max_bytes(150000):strip_icc()/crispy-comte-cheesburgers-FT-RECIPE0921-6166c6552b7148e8a8561f7765ddf20b.jpg" width="750" height="400">
      </div>
      <div class="img-comp-img img-comp-overlay">
        <img src="https://images.themodernproper.com/production/posts/2022/Homemade-French-Fries_8.jpg?w=1200&h=1200&q=60&fm=jpg&fit=crop&dm=1662474181&s=15046582e76b761a200998df2dcad0fd" width="750" height="400">
      </div>
    </div>
  
    <script>
      initComparisons();
    </script>
  </body>
</html>
