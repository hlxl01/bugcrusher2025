<!DOCTYPE html>
<html>
  <style>
    .img-comp-container {
      position: relative;
      height: 500px; /*should be the same height as the images*/
    }
    
    .img-comp-img {
      position: absolute;
      width: auto;
      height: auto;
      overflow: hidden;
    }
    
    .img-comp-img img {
      display: block;
      vertical-align: middle;
    }
    
    .img-comp-slider {
      position: absolute;
      z-index: 9;
      cursor: ew-resize;
      /*set the appearance of the slider:*/
      width: 40px;
      height: 40px;
      background-color: #2196F3;
      opacity: 0.7;
      border-radius: 50%;
    }
  
    ::-webkit-scrollbar {
      display: none;
    }
  </style>
  <head>
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
  </head>
  <body>
    <div class="img-comp-container">
      <div class="img-comp-img">
        <img src="sad.webp" width="750" height="400">
      </div>
      <div class="img-comp-img img-comp-overlay">
        <img src="happy.webp" width="750" height="400">
      </div>
    </div>
  
    <script>
      initComparisons();
    </script>
  </body>
